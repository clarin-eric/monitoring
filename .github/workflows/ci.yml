name: CI Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11"]

    steps:
    #Checkout main repository _without_ submodules
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        submodules: false

    #Setup authentication via install clarin-monitoring github app
    - name: Generate App token for submodules
      id: submodule-token
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ vars.APP_CLIENT_ID }}
        private-key: ${{ secrets.APP_PRIVATE_KEY }}
        owner: clarin-eric
        repositories: |
          monitoring-users
          monitoring-dariah

    #Use the short lived token from the previous step to checkout the submodules
    - name: Fetch private submodules
      run: |
        git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' '${{ steps.clarin-token.outputs.token }}' | base64 -w0)"
        git submodule sync
        git -c protocol.version=2 submodule update --init --force --depth=1

    #Setup python
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    #Build the nagios config
    - name: Install dependencies & Build
      run: |
        pip install -r requirements.txt
        pip install pycodestyle
        docker build --rm -f "Dockerfile" -t icinga2-cli "."
        echo "const PluginDir = \"/usr/lib/nagios/plugins\"" > constants.conf
        echo "const ManubulonPluginDir = \"/usr/lib/nagios/plugins\"" >> constants.conf
        echo "const PluginContribDir = \"/usr/lib/nagios/plugins\"" >> constants.conf
        echo "const NodeName = \"clarin-monitoring\"" >> constants.conf
        echo "const ZoneName = \"clarin-monitoring\"" >> constants.conf
        mkdir -p features-enabled

    #Run all tests
    - name: Run Tests
      run: |
        find . -name "*.py" -exec pycodestyle {} +
        python3 update_config.py --nopull --nosubmodule
        docker run --rm -v $(pwd):/etc/icinga2/ icinga2-cli

